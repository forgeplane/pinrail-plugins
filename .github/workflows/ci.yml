# Every plugin built where it has a build, checked as the app would check
# it, and tested under the pinrail-sdk harness.
#
# The SDK is pinrail-sdk from npm, at the version pnpm-lock.yaml records,
# and the CLI comes from the latest release of the app, forgeplane/pinrail.
# While that repository is private, downloading the CLI needs the
# PINRAIL_READ_TOKEN secret: a fine-grained token with read access to its
# contents. Once it is public, the secret can go.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "plugins/*/package-lock.json"
      # pnpm, at the version package.json names
      - name: pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # the views, scripts, tests and styles as Prettier formats them;
      # `pnpm format` fixes them
      - name: Format
        run: pnpm run format:check
      # `pinrail plugins check` checks the plugins, so the CLI goes on the
      # PATH first: the one the app's latest release carries
      - name: Install the CLI
        env:
          GH_TOKEN: ${{ secrets.PINRAIL_READ_TOKEN || github.token }}
        run: |
          gh release download --repo forgeplane/pinrail \
            --pattern pinrail-cli-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pinrail"
          tar -xzf "$RUNNER_TEMP/pinrail-cli-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/pinrail"
          echo "$RUNNER_TEMP/pinrail" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pinrail/pinrail" --version
      # each plugin with a build step, whose package.json has a build script
      - name: Build the plugins that have a build
        run: |
          for dir in plugins/*/; do
            [ -f "$dir/package.json" ] || continue
            node -e 'process.exit(require(process.argv[1]).scripts?.build ? 0 : 1)' "$PWD/$dir/package.json" || continue
            (cd "$dir" && npm ci && npm run build)
          done
      # after the builds, which write the views that are not committed. The
      # check refuses a plugin the app would refuse, and a recorded decision
      # whose Markdown or summary is not what the app makes of it; an
      # official plugin must also have nothing dropped.
      - name: Check the plugins
        run: |
          for dir in plugins/*/; do
            pinrail plugins check "$dir" --json > verdict.json || { cat verdict.json; exit 1; }
            jq -e '.warnings == []' verdict.json > /dev/null || { echo "$dir: features dropped:"; jq '.warnings' verdict.json; exit 1; }
          done
          rm verdict.json
      - name: Test
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: plugin-traces
          path: test-results
          if-no-files-found: ignore
